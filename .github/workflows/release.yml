name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # electron-builder's own publishing uploads files in parallel and each upload can create
      # its own GitHub Release, which left two releases per tag. Build without publishing, then
      # create one Release with every file in a single step.
      - name: Build installer
        run: npm run dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILES=(release/*-setup-"$VERSION".exe release/*-setup-"$VERSION".exe.blockmap release/latest.yml)
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then echo "Missing $f"; exit 1; fi
          done
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --verify-tag --title "$VERSION" --generate-notes
